
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Studium — Entrar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main>
      <div class="login">
        <a href="index.html">
          <img src="/img/studium preto.png" alt="Studium" class="logo" />
        </a>
        <section id="area-login">
          <div class="texto">
            <p>SEJA BEM-VINDO</p>

            <h1>Entre na sua conta.</h1>

            <span> Continue de onde você parou. </span>
          </div>

          <form id="form-login" onsubmit="fazerLogin(event)">
            <label>
              Email

              <input
                type="email"
                id="login-email"
                placeholder="seu@email.com"
                required
              />
            </label>

            <label>
              Senha

              <input
                type="password"
                id="login-senha"
                placeholder="Sua senha"
                required
              />
            </label>

            <button type="submit" class="botao-principal">Entrar</button>

            <p id="mensagem-login"></p>
          </form>

          <div class="troca">
            <span> Ainda não tem uma conta? </span>

            <button onclick="mostrarCadastro()">Criar uma conta</button>
          </div>
        </section>

        <section id="area-cadastro" class="escondido">
          <div class="texto">
            <p>COMECE AGORA</p>

            <h1>Crie sua conta.</h1>

            <span> Organize seus estudos com o Studium. </span>
          </div>

          <form id="form-cadastro" onsubmit="fazerCadastro(event)">
            <label>
              Nome

              <input
                type="text"
                id="cadastro-nome"
                placeholder="Seu nome"
                required
              />
            </label>

            <label>
              Email

              <input
                type="email"
                id="cadastro-email"
                placeholder="seu@email.com"
                required
              />
            </label>

            <label>
              Senha

              <input
                type="password"
                id="cadastro-senha"
                placeholder="Crie uma senha"
                required
              />
            </label>

            <div class="tipo">
              <p>Você é:</p>

              <div class="opcoes-tipo">
                <button
                  type="button"
                  class="tipo-botao ativo"
                  data-tipo="aluno"
                  onclick="selecionarTipo(this)"
                >
                  Aluno
                </button>

                <button
                  type="button"
                  class="tipo-botao"
                  data-tipo="professor"
                  onclick="selecionarTipo(this)"
                >
                  Professor
                </button>
              </div>
            </div>

            <button type="submit" class="botao-principal">Criar conta</button>

            <p id="mensagem-cadastro"></p>
          </form>

          <div class="troca">
            <span> Já tem uma conta? </span>

            <button onclick="mostrarLogin()">Entrar</button>
          </div>
        </section>
        <a href="index.html" class="voltar"> ← Voltar para o início </a>
      </div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
